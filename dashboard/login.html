<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberBot Dashboard - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7c3aed;
      --secondary: #3b82f6;
      --dark: #0f172a;
      --darker: #020617;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, #1a1a2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-icon {
      font-size: 48px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      transition: all 0.3s;
      font-family: 'Courier New', monospace;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(124, 58, 237, 0.05);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 20px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .info-section {
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 24px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .info-section strong {
      color: var(--primary);
    }

    .error-message {
      color: #fca5a5;
      font-size: 13px;
      margin-top: 8px;
      display: none;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--primary);
      font-weight: 600;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(124, 58, 237, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="login-icon">🔐</div>
    <h1 class="login-title">CyberBot</h1>
    <p class="login-subtitle">Dashboard Control Panel</p>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">API Token</label>
      <input 
        type="password" 
        id="tokenInput" 
        class="form-input" 
        placeholder="Enter your API token..."
        required
      >
    </div>

    <div class="error-message" id="errorMessage"></div>

    <button type="submit" class="login-btn">
      <span id="btnText">Login</span>
      <span class="loading" id="loading">
        <span class="spinner"></span>Authenticating...
      </span>
    </button>
  </form>

  <div class="info-section">
    <strong>📋 Setup Instructions:</strong><br>
    1. Get your bot token from .env<br>
    2. Set API_TOKEN in server config<br>
    3. Use that token to login here<br><br>
    <strong>🔗 Local:</strong> http://localhost:3000<br>
    <strong>🌐 Live:</strong> apxllo1.github.io/Cyber-Security-/dashboard
  </div>

  <p class="footer-text">
    CyberSec Bot v1.0.0 | 
    <a href="https://github.com/apxllo1/Cyber-Security-" target="_blank">GitHub</a>
  </p>
</div>

<script>
async function handleLogin(event) {
  event.preventDefault();
  
  const token = document.getElementById('tokenInput').value;
  const btnText = document.getElementById('btnText');
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('errorMessage');
  
  if (!token) {
    showError('Token required');
    return;
  }

  btnText.style.display = 'none';
  loading.style.display = 'inline';

  try {
    // Test token by making API call
    const response = await fetch('http://localhost:3001/api/bot/status', {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (response.ok) {
      localStorage.setItem('botToken', token);
      window.location.href = 'index.html';
    } else {
      showError('Invalid token. Check your API_TOKEN in .env');
    }
  } catch (error) {
    showError('Cannot connect to API. Is the server running on port 3001?');
  }

  btnText.style.display = 'inline';
  loading.style.display = 'none';
}

function showError(msg) {
  const errorMsg = document.getElementById('errorMessage');
  errorMsg.textContent = '⚠️ ' + msg;
  errorMsg.style.display = 'block';
  setTimeout(() => {
    errorMsg.style.display = 'none';
  }, 5000);
}

// Check if already logged in
window.addEventListener('load', () => {
  const token = localStorage.getItem('botToken');
  if (token) {
    window.location.href = 'index.html';
  }
});
</script>

</body>
</html>
